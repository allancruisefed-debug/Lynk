<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lynk Master Runner</title>
</head>

<body>

<script>

const MEMORY_KEY = "lynk_master_memory";
const PERSONA_KEY = "lynk_persona";
const SYSTEM_PROMPT_KEY = "lynk_extra_system_prompt";


/* =========================
   MEMORY
========================= */

function getMemory() {

  try {

    return JSON.parse(
      localStorage.getItem(MEMORY_KEY) || "{}"
    );

  } catch (error) {

    throw new Error(
      "Could not read memory: " + error.message
    );

  }

}


function saveMemory(memory) {

  localStorage.setItem(
    MEMORY_KEY,
    JSON.stringify(memory)
  );

}


/* =========================
   WEB SEARCH
========================= */

async function searchDuckDuckGo(query) {

  const searchUrl =
    "https://html.duckduckgo.com/html/?q=" +
    encodeURIComponent(query);


  const response = await fetch(searchUrl);


  if (!response.ok) {

    throw new Error(
      "DuckDuckGo request failed with HTTP " +
      response.status
    );

  }


  const html = await response.text();


  const parser = new DOMParser();

  const doc =
    parser.parseFromString(
      html,
      "text/html"
    );


  const results =
    [...doc.querySelectorAll(".result")]

      .map(result => {

        const link =
          result.querySelector(".result__a");

        const snippet =
          result.querySelector(
            ".result__snippet"
          );


        return {

          title:
            link?.textContent?.trim() || "",

          url:
            link?.href || "",

          snippet:
            snippet?.textContent?.trim() || ""

        };

      })

      .filter(result =>
        result.title &&
        result.url
      )

      .slice(0, 5);


  return {

    action: "search",

    success: true,

    query,

    results

  };

}


/* =========================
   MEMORY ACTION
========================= */

async function memoryAction(input) {

  const memory = getMemory();

  const operation =
    input.operation;


  /* SAVE */

  if (operation === "save") {

    if (!input.key) {

      throw new Error(
        "Memory save requires a key."
      );

    }


    memory[input.key] =
      input.value;


    saveMemory(memory);


    return {

      action: "memory",

      operation: "save",

      success: true,

      key: input.key,

      value: input.value

    };

  }


  /* GET */

  if (operation === "get") {

    if (!input.key) {

      throw new Error(
        "Memory get requires a key."
      );

    }


    return {

      action: "memory",

      operation: "get",

      success: true,

      key: input.key,

      value:
        memory[input.key] ?? null

    };

  }


  /* SEARCH MEMORY */

  if (operation === "search") {

    const query =
      String(
        input.query || ""
      ).toLowerCase();


    const matches =

      Object.entries(memory)

        .filter(([key, value]) =>

          key
            .toLowerCase()
            .includes(query)

          ||

          JSON.stringify(value)
            .toLowerCase()
            .includes(query)

        )

        .map(([key, value]) => ({

          key,

          value

        }));


    return {

      action: "memory",

      operation: "search",

      success: true,

      query,

      matches

    };

  }


  /* DELETE */

  if (operation === "delete") {

    if (!input.key) {

      throw new Error(
        "Memory delete requires a key."
      );

    }


    const existed =
      Object.hasOwn(
        memory,
        input.key
      );


    delete memory[input.key];


    saveMemory(memory);


    return {

      action: "memory",

      operation: "delete",

      success: true,

      key: input.key,

      deleted: existed

    };

  }


  throw new Error(
    "Unknown memory operation."
  );

}


/* =========================
   CONTEXT ACTION
========================= */

async function contextAction(input) {

  const operation =
    input.operation;


  /* LOAD */

  if (
    !operation ||
    operation === "load"
  ) {

    return {

      action: "context",

      operation: "load",

      success: true,

      persona:
        localStorage.getItem(
          PERSONA_KEY
        ) || "",

      systemPrompt:
        localStorage.getItem(
          SYSTEM_PROMPT_KEY
        ) || ""

    };

  }


  /* SET PERSONA */

  if (
    operation === "set_persona"
  ) {

    if (
      typeof input.value !==
      "string"
    ) {

      throw new Error(
        "Persona must be a string."
      );

    }


    localStorage.setItem(
      PERSONA_KEY,
      input.value
    );


    return {

      action: "context",

      operation,

      success: true,

      persona: input.value

    };

  }


  /* SET SYSTEM PROMPT */

  if (
    operation ===
    "set_system_prompt"
  ) {

    if (
      typeof input.value !==
      "string"
    ) {

      throw new Error(
        "System prompt must be a string."
      );

    }


    localStorage.setItem(
      SYSTEM_PROMPT_KEY,
      input.value
    );


    return {

      action: "context",

      operation,

      success: true,

      systemPrompt: input.value

    };

  }


  throw new Error(
    "Unknown context operation."
  );

}


/* =========================
   MASTER ACTION ROUTER
========================= */

async function runAction(input) {

  if (
    !input ||
    typeof input !== "object"
  ) {

    throw new Error(
      "Invalid action data."
    );

  }


  const action =
    input.action;


  /* SEARCH */

  if (
    action === "search"
  ) {

    const query =
      String(
        input.query || ""
      ).trim();


    if (!query) {

      throw new Error(
        "Search requires a query."
      );

    }


    return await searchDuckDuckGo(
      query
    );

  }


  /* MEMORY */

  if (
    action === "memory"
  ) {

    return await memoryAction(
      input
    );

  }


  /* CONTEXT */

  if (
    action === "context"
  ) {

    return await contextAction(
      input
    );

  }


  throw new Error(
    "Unknown action. Use: search, memory, or context."
  );

}


/* =========================
   EDGE GALLERY BRIDGE
========================= */

window[
  "ai_edge_gallery_get_result"
] = async (data) => {

  try {

    const input =
      typeof data === "string"

        ? JSON.parse(data)

        : data;


    const result =
      await runAction(input);


    return JSON.stringify({

      result

    });


  } catch (error) {

    return JSON.stringify({

      error:
        error.message

    });

  }

};

</script>

</body>
</html>
