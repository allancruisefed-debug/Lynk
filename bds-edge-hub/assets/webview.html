<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDS Edge Hub UI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e14;
      color: #e8edf5;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: #151e27;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #2a3643;
    }
    h2 {
      color: #86efac;
      margin-top: 0;
      font-weight: 400;
    }
    .info {
      background: #0e151e;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 3px solid #2a8c5a;
    }
    .label {
      font-size: 11px;
      color: #7a8fa5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .value {
      font-size: 16px;
      font-weight: 500;
      margin-top: 4px;
      word-break: break-all;
    }
    .online { color: #4ade80; }
    .offline { color: #f87171; }
    .footer {
      margin-top: 16px;
      font-size: 12px;
      color: #5d738b;
      text-align: center;
      border-top: 1px solid #1f2d3d;
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>⚡ BDS Edge Hub</h2>
    <div class="info">
      <div class="label">Gateway Status</div>
      <div class="value" id="status">⏳ Connecting...</div>
    </div>
    <div class="info">
      <div class="label">Skills Directory</div>
      <div class="value" id="skillsDir">—</div>
    </div>
    <div class="info">
      <div class="label">Installed Skills</div>
      <div class="value" id="skillsCount">—</div>
    </div>
    <div class="footer">
      BDS Edge Hub · Connected via Tailscale
    </div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const host = params.get('host') || 'zink.tail5bffe3.ts.net';
      const port = params.get('port') || '8765';
      const secret = params.get('secret') || '';

      document.getElementById('status').textContent = `🔗 Gateway: ${host}:${port}`;

      // Try to fetch status
      fetch(`http://${host}:${port}/api/execute`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${secret}`
        },
        body: JSON.stringify({ action: 'get_status', parameters: {} })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById('status').innerHTML = '<span class="online">● Online</span>';
        document.getElementById('skillsDir').textContent = data.skills_dir || '—';
        document.getElementById('skillsCount').textContent = data.skills_count ?? '0';
      })
      .catch(() => {
        document.getElementById('status').innerHTML = '<span class="offline">● Offline</span>';
        document.getElementById('skillsDir').textContent = '❌ Connection failed';
        document.getElementById('skillsCount').textContent = '—';
      });
    })();
  </script>
</body>
</html>
