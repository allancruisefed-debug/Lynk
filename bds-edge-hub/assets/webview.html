<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway Status</title>
    <style>
        /* Styling for the interactive UI */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #151e27;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #2a3643;
            text-align: center;
        }
        h2 {
            margin: 0 0 12px 0;
            color: #86efac;
            font-weight: 400;
        }
        .info {
            background: #0e151e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #2a8c5a;
        }
        .label {
            font-size: 12px;
            color: #7a8fa5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .value {
            font-size: 18px;
            font-weight: 500;
            word-break: break-all;
        }
        .status-online {
            color: #4ade80;
        }
        .status-offline {
            color: #f87171;
        }
        .footer {
            margin-top: 16px;
            font-size: 12px;
            color: #5d738b;
            border-top: 1px solid #1f2d3d;
            padding-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ BDS Edge Hub</h2>
        <div class="info">
            <div class="label">Gateway Status</div>
            <div class="value" id="gatewayStatus">⏳ Loading...</div>
        </div>
        <div class="info">
            <div class="label">Skills Directory</div>
            <div class="value" id="skillsDir">—</div>
        </div>
        <div class="info">
            <div class="label">Installed Skills</div>
            <div class="value" id="skillsCount">—</div>
        </div>
        <div class="footer">
            Data received from the laptop gateway via the hidden skill logic.
        </div>
    </div>

    <script>
        // The webview receives its data via URL query parameters
        // as recommended by the official documentation [citation:5].
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('status');
            const skillsDir = urlParams.get('skillsDir');
            const skillsCount = urlParams.get('skillsCount');

            const statusEl = document.getElementById('gatewayStatus');
            const dirEl = document.getElementById('skillsDir');
            const countEl = document.getElementById('skillsCount');

            if (status === 'online') {
                statusEl.innerHTML = '<span class="status-online">● Online</span>';
            } else if (status === 'offline') {
                statusEl.innerHTML = '<span class="status-offline">● Offline</span>';
            } else {
                statusEl.textContent = '⚠️ Unknown';
            }

            dirEl.textContent = skillsDir || '—';
            countEl.textContent = skillsCount !== null ? skillsCount : '—';
        })();
    </script>
</body>
</html>
