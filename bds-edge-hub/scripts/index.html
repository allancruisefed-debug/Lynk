<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
</head>
<body>
<script>
window['ai_edge_gallery_get_result'] = async (data, secret) => {
  console.log("📥 Received data:", data);
  console.log("🔑 Secret provided:", secret ? "Yes" : "No");

  try {
    // Parse the incoming data
    const request = JSON.parse(data);
    const action = request.action || "unknown";
    const parameters = request.parameters || {};

    console.log("🎯 Action:", action);
    console.log("📦 Parameters:", parameters);

    // ========== CONFIG ==========
    const GATEWAY_HOST = "zink.tail5bffe3.ts.net";
    const GATEWAY_PORT = 8765;
    const GATEWAY = `http://${GATEWAY_HOST}:${GATEWAY_PORT}`;
    // ============================

    // Special case: open the interactive UI
    if (action === "open_ui") {
      console.log("🖥️ Opening UI...");
      const params = new URLSearchParams({
        host: GATEWAY_HOST,
        port: GATEWAY_PORT,
        secret: secret || ""
      });

      return JSON.stringify({
        result: "BDS Edge Hub interface opened.",
        webview: {
          url: `assets/webview.html?${params.toString()}`,
          aspectRatio: 1.25
        }
      });
    }

    // Test action: just return a success message
    if (action === "test") {
      console.log("🧪 Test action called!");
      return JSON.stringify({
        result: {
          message: "✅ Test successful! The skill is working!",
          timestamp: new Date().toISOString(),
          action: action
        }
      });
    }

    // All other actions go to the laptop gateway
    console.log(`🌐 Calling gateway: ${GATEWAY}/api/execute`);
    const response = await fetch(`${GATEWAY}/api/execute`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${secret || ""}`
      },
      body: JSON.stringify({
        action: action,
        parameters: parameters
      })
    });

    console.log("📡 Response status:", response.status);
    const result = await response.json();
    console.log("📨 Response data:", result);

    if (!response.ok) {
      return JSON.stringify({
        error: result.error || `Gateway returned HTTP ${response.status}`
      });
    }

    return JSON.stringify({
      result: result
    });

  } catch (error) {
    console.error("❌ ERROR:", error);
    console.error("📋 Stack:", error.stack);
    return JSON.stringify({
      error: `JS Error: ${error.message}`,
      stack: error.stack
    });
  }
};
</script>
</body>
</html>
